name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WordPress requires the plugin to live in a FOLDER inside the zip
      # (uploading a flat zip is rejected as "no valid plugins found").
      - name: Build 365nails-sync.zip
        run: |
          set -euo pipefail
          SLUG=365nails-sync
          BUILD=/tmp/build
          rm -rf "$BUILD" && mkdir -p "$BUILD/$SLUG"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.DS_Store' \
            ./ "$BUILD/$SLUG/"
          cd "$BUILD"
          zip -r "$SLUG.zip" "$SLUG"
          echo "built: $(ls -la $SLUG.zip)"

      - name: Create release with the zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 字面块（|）保换行：YAML 折叠标量会把行尾的反斜杠变成字面参数
        # （v0.1.0 第一次发布就是这么挂的 —— zip 已打出，create 报
        # "no matches found for ` --title`"）。
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            /tmp/build/365nails-sync.zip
